plugins { id 'com.android.application' }

// BM Player: one app for Android TV, Fire TV and Android phones.
// Logins arrive from the website (bmsupport.uk/send-to-app); DNS comes from the admin panel.
def ksPass = System.getenv("ANDROID_KEYSTORE_PASSWORD")

android {
    namespace = "uk.bmsupport.player"
    compileSdk = 36
    defaultConfig {
        applicationId "uk.bmsupport.player"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 260
        versionName "4.49"
        // Android TV, Fire TV and phones are ARM; the backup engine's native libraries stay ARM-only to keep the download small.
        ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
    }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    signingConfigs {
        release {
            if (ksPass) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "../../android/keystore/bmsupport-release.jks")
                storePassword ksPass
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "bmsupport"
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: ksPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksPass) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
    testOptions { unitTests { includeAndroidResources = true } }
    sourceSets.main.res.srcDir(layout.buildDirectory.dir('generated/intro-res'))
}

tasks.register('prepareIntro', Exec) {
    def output = layout.buildDirectory.file('generated/intro-res/raw/player_intro.mp4')
    inputs.file('../../src/assets/player-family-intro.mp4.asset.json')
    outputs.file(output)
    doFirst { output.get().asFile.parentFile.mkdirs() }
    commandLine 'lovable-assets', 'get', '--overwrite', '--file', file('../../src/assets/player-family-intro.mp4.asset.json').absolutePath, '-o', output.get().asFile.absolutePath
}
tasks.named('preBuild').configure { dependsOn('prepareIntro') }

dependencies {
    def m3 = '1.5.1'
    implementation "androidx.media3:media3-exoplayer:$m3"
    implementation "androidx.media3:media3-exoplayer-hls:$m3"
    implementation "androidx.media3:media3-exoplayer-dash:$m3"
    implementation "androidx.media3:media3-exoplayer-smoothstreaming:$m3"
    implementation "androidx.media3:media3-exoplayer-rtsp:$m3"
    implementation "androidx.media3:media3-ui:$m3"
    // FFmpeg audio (AC-3, E-AC-3, DTS, TrueHD, etc.) for streams the TV can't decode itself.
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.5.0+1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'org.videolan.android:libvlc-all:3.6.0'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
