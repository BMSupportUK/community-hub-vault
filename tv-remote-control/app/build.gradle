plugins { id 'com.android.application' }

// BM Remote Control — tiny accessibility-service app that presses remote buttons on the TV
// during a help session. Rebuilt in-house (was versionCode 2 signed with a retired key);
// versionCode 3 is signed with the permanent BM key so the signature-level CONTROL
// permission matches BM Remote Helper 2.4+. Signed per android/SIGNING.md.
def ksPass = System.getenv("ANDROID_KEYSTORE_PASSWORD")

android {
    namespace = "uk.bmsupport.remote.control"
    compileSdk = 34
    defaultConfig {
        applicationId "uk.bmsupport.remote.control"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 3
        versionName "1.1"
    }
    signingConfigs {
        release {
            if (ksPass) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "../../android/keystore/bmsupport-release.jks")
                storePassword ksPass
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "bmsupport"
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: ksPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksPass) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
