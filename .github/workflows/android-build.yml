name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Create dist placeholder (app loads remote URL)
        run: mkdir -p dist && echo '<!doctype html><title>BM Support</title>' > dist/index.html

      - name: Ensure Android assets dir exists
        run: mkdir -p android/app/src/main/assets

      - name: Capacitor sync with Node.js 22 (never bunx)
        run: |
          node --version
          ./node_modules/.bin/cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BMSupport.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: BMSupport-apk
          path: BMSupport.apk
          if-no-files-found: error
          retention-days: 7